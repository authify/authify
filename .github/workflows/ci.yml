name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.20.3'
  OTP_VERSION: '29.0.5'

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} / Partition ${{ matrix.partition }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        elixir: ['1.20.3', 'main']
        otp: ['29.0.5']
        partition: [1, 2, 3, 4]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: authify_test
          MYSQL_USER: authifytest
          MYSQL_PASSWORD: authifytest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile application
        run: mix compile --warnings-as-errors

      - name: Create partition database
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS authify_test${{ matrix.partition }}; GRANT ALL PRIVILEGES ON authify_test${{ matrix.partition }}.* TO 'authifytest'@'%'; FLUSH PRIVILEGES;"

      - name: Check code formatting
        if: matrix.partition == 1
        run: mix format --check-formatted

      - name: Run tests
        env:
          CI_MODE: "true"
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: mix test --partitions 4

      - name: Run code quality checks
        if: matrix.partition == 1
        run: mix credo --strict

      - name: Run security scan (Sobelow)
        if: matrix.partition == 1
        run: mix sobelow --config

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Only validate the image build on pull requests. Releases build and push
    # the canonical image via release.yml, so building again on main/develop
    # pushes (and the release tag) would be redundant work.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: authify:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
