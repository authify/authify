name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The image version tag actually pushed (e.g. `0.24.1`). `metadata-action`
      # strips the leading `v` from the git tag for `type=semver`, so this is not
      # the same as `github.ref_name`.
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --abbrev=0 --tags "$(git rev-list --tags --skip=1 --max-count=1)" 2>/dev/null || echo "")

          # Determine the commit range to summarize
          if [ -z "$PREV_TAG" ]; then
            RANGE="$REF_NAME"
          else
            RANGE="$PREV_TAG..$REF_NAME"
          fi

          # Write the notes to a file rather than inlining them into a shell
          # string: commit subjects can contain quotes or other shell
          # metacharacters that would otherwise break argument parsing.
          {
            echo "## Changes"
            echo
            git log --pretty=format:"- %s (%h)" "$RANGE"
            echo
            echo
            echo "## Docker Image"
            echo
            echo '```bash'
            echo "docker pull $IMAGE_REF"
            echo '```'
            echo
            echo "## Installation"
            echo
            echo "See the [documentation](https://github.com/authify/authify/wiki) for installation instructions."
          } > release-notes.md

          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" \
            --title "Release $REF_NAME" \
            --notes-file release-notes.md
